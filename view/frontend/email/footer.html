<!--@subject {{trans "Rameera Store Footer"}} @-->
<!--@vars {
"var store.frontend_name":"Store Name"
} @-->
              <table
                cellpadding="0"
                cellspacing="0"
                class="es-content esd-footer-popover"
                align="center"
              >
                <tbody>
                  <tr>
                    <td class="esd-stripe" align="center">
                      <table
                        bgcolor="#ffffff"
                        class="es-content-body"
                        align="center"
                        cellpadding="0"
                        cellspacing="0"
                        width="600"
                      >
                        <tbody>
                          <tr>
                            <td
                              class="esd-structure es-p20t es-p30b es-p20r es-p20l esdev-adapt-off"
                              align="left"
                              bgcolor="#000000"
                              style="
                                background-color: #000000;
                                border-radius: 0px 0px 5px 5px;
                              "
                            >
                              <table
                                width="560"
                                cellpadding="0"
                                cellspacing="0"
                                class="esdev-mso-table"
                              >
                                <tbody>
                                  <tr>
                                    <td class="esdev-mso-td" valign="top">
                                      <table
                                        cellpadding="0"
                                        cellspacing="0"
                                        align="left"
                                        class="es-left"
                                      >
                                        <tbody>
                                          <tr>
                                            <td
                                              width="280"
                                              class="esd-container-frame"
                                              align="center"
                                              valign="top"
                                            >
                                              <table
                                                cellpadding="0"
                                                cellspacing="0"
                                                width="100%"
                                              >
                                                <tbody>
                                                  <tr>
                                                    <td
                                                      align="left"
                                                      class="esd-block-text"
                                                    >
                                                      <p
                                                        style="
                                                          color: #ffffff;
                                                          font-size: 12px;
                                                        "
                                                      >
                                                        {{var store.formatted_address|raw}}
                                                      </p>
                                                    </td>
                                                  </tr>
                                                </tbody>
                                              </table>
                                            </td>
                                          </tr>
                                        </tbody>
                                      </table>
                                    </td>
                                    <td class="esdev-mso-td" valign="top">
                                      <table
                                        cellpadding="0"
                                        cellspacing="0"
                                        class="es-right"
                                        align="right"
                                      >
                                        <tbody>
                                          <tr>
                                            <td
                                              width="280"
                                              align="left"
                                              class="esd-container-frame"
                                            >
                                              <table
                                                cellpadding="0"
                                                cellspacing="0"
                                                width="100%"
                                              >
                                                <tbody>
                                                  <tr>
                                                    <td
                                                      align="right"
                                                      class="esd-block-image"
                                                      style="font-size: 0px"
                                                    >
                                                      <a
                                                        target="_blank"
                                                        href="{{store url=""}}"
                                                        ><img
                                                          class="adapt-img"
                                                          src="{{media url=email/logo/logo_footer.png}}"
                                                          alt
                                                          style="display: block"
                                                          width="191"
                                                      /></a>
                                                    </td>
                                                  </tr>
                                                </tbody>
                                              </table>
                                            </td>
                                          </tr>
                                        </tbody>
                                      </table>
                                    </td>
                                  </tr>
                                </tbody>
                              </table>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </td>
                  </tr>
                </tbody>
              </table>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
